<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラスター画像 → SVG変換</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    background: #f6f7f9;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1d21; color: #e8e8e8; }
    header, .panel { background: #24262b !important; border-color: #383b42 !important; }
    input, select { background: #1b1d21; color: #e8e8e8; border-color: #444 !important; }
    .preview { background: #2a2c31 !important; }
    details.group { border-color: #383b42; }
    details.group summary { color: #aaa; }
    .field.changed input, .field.changed select { border-color: #5b8def !important; }
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e2e4e8;
    padding: 12px 20px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #666; }
  .status { font-size: 13px; }
  .status.err { color: #c0392b; }
  main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 16px;
    padding: 16px 20px;
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: #fff;
    border: 1px solid #e2e4e8;
    border-radius: 8px;
    padding: 14px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 14px; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 12px; margin-bottom: 2px; }
  .field .hint { color: #888; font-weight: normal; }
  .field input[type=number], .field input[type=text], .field select {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
  }
  .field.inline { display: flex; align-items: center; gap: 8px; }
  .field.inline label { margin: 0; }
  details.group { border: 1px solid #e2e4e8; border-radius: 6px; margin: 0 0 8px; }
  details.group summary {
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    user-select: none;
  }
  details.group .body { padding: 2px 10px 8px; }
  .chg-count { color: #2d6cdf; font-weight: 600; font-size: 11px; }
  .field.changed label::before { content: "✱ "; color: #2d6cdf; font-weight: 700; }
  .field.changed input, .field.changed select { border-color: #2d6cdf; }
  .note { font-size: 11px; color: #888; margin: 8px 2px; }
  .note.warn { color: #b8860b; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #2d6cdf;
    border-top-color: transparent;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: -2px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview.busy { opacity: 0.5; }
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #2d6cdf;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled { background: #9db4de; cursor: not-allowed; }
  button.secondary { background: #6b7280; }
  .preview {
    background: #eef0f3;
    border-radius: 6px;
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 8px;
  }
  .preview svg, .preview img { max-width: 100%; height: auto; }
  .preview-meta { font-size: 12px; color: #666; margin: 6px 2px 0; }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .previews { grid-template-columns: 1fr; } }
  #report {
    margin: 10px 0 0;
    padding: 8px 10px;
    background: #eef0f3;
    border-radius: 6px;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  @media (prefers-color-scheme: dark) {
    #report { background: #2a2c31; }
  }
</style>
</head>
<body>
<header>
  <h1>ラスター画像 → SVG変換</h1>
  <p>ラスター画像 (PNG / JPEG / GIF) をブラウザ上で SVG に変換します。処理はすべてローカル (wasm) で完結し、サーバーには送信されません。</p>
  <p id="status" class="status">wasm を読み込み中…</p>
</header>

<main>
  <section class="panel" id="controls">
    <h2>オプション</h2>
    <div class="field">
      <label for="file">入力画像</label>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif">
    </div>
    <div class="field">
      <label for="autotune">自動調整 (閉ループ)</label>
      <select id="autotune">
        <option value="" selected>なし</option>
        <option value="detail">detail (忠実度重視)</option>
        <option value="balanced">balanced</option>
        <option value="compact">compact (単純さ重視)</option>
      </select>
    </div>
    <p class="note warn">⚠ 自動調整は出力を描画して入力と比較する処理を何度も繰り返すため、
      変換に数百秒かかることがあります。</p>
    <p class="note">✱ の付いた項目は既定値から変更されています。変更した値は自動調整
      (-auto / 閉ループ) でも上書きされず、そのまま優先されます。</p>
    <div class="field">
      <label for="preset">プリセット <span class="hint">(下のオプション欄に値を反映)</span></label>
      <select id="preset">
        <option value="default" selected>デフォルト</option>
        <option value="anime">イラスト・アニメ</option>
      </select>
    </div>
    <div class="actions">
      <button id="run" disabled>変換</button>
      <button id="download" class="secondary" disabled>SVG を保存</button>
    </div>
    <form id="opts"><!-- options generated by app.js --></form>
  </section>

  <section class="panel">
    <h2>プレビュー</h2>
    <div class="previews">
      <div>
        <div class="preview" id="srcPreview"><span style="color:#999;font-size:13px">元画像</span></div>
        <div class="preview-meta" id="srcMeta"></div>
      </div>
      <div>
        <div class="preview" id="svgPreview"><span style="color:#999;font-size:13px">変換結果</span></div>
        <div class="preview-meta" id="svgMeta"></div>
      </div>
    </div>
    <pre id="report" hidden></pre>
  </section>
</main>

<!-- wasm_exec.js と rastersvg.wasm は worker.js が読み込む (変換は Web Worker で実行) -->
<script src="app.js"></script>
</body>
</html>
